# railway.toml — Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Must match the Procfile exactly
startCommand = "gunicorn --worker-class gevent --workers 1 --bind 0.0.0.0:$PORT server:app"

# Railway polls this path after every deploy to confirm the service is healthy.
# /api/health returns 200 when Flask + MySQL are both up, 503 if DB is unreachable.
healthcheckPath = "/api/health"

# Give the app up to 60s to boot (DB init + seeding can take a few seconds)
healthcheckTimeout = 60

# Restart automatically if the process crashes
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
